<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Login · Prachi Laundry</title>
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    * { font-family: 'Inter', system-ui, sans-serif; }

    /* ---------- DARK MODE ---------- */
    html.dark { color-scheme: dark; }
    html.dark body { background-color: #0f172a !important; color: #e2e8f0 !important; }
    html.dark .bg-white { background-color: #1e293b !important; }
    html.dark .bg-slate-50 { background-color: #0f172a !important; }
    html.dark .border-slate-200 { border-color: #334155 !important; }
    html.dark .text-slate-800 { color: #f1f5f9 !important; }
    html.dark .text-slate-600 { color: #94a3b8 !important; }
    html.dark .text-slate-500 { color: #64748b !important; }
    html.dark input { color: #f1f5f9 !important; background-color: #0f172a !important; border-color: #334155 !important; }
    html.dark input::placeholder { color: #64748b !important; }

    /* ---------- GRADIENT BACKGROUND ---------- */
    .login-bg {
      background:
        radial-gradient(circle at 15% 15%, rgba(99,102,241,0.15), transparent 45%),
        radial-gradient(circle at 85% 25%, rgba(236,72,153,0.12), transparent 45%),
        radial-gradient(circle at 50% 95%, rgba(56,189,248,0.1), transparent 55%);
    }
    html.dark .login-bg {
      background:
        radial-gradient(circle at 15% 15%, rgba(99,102,241,0.22), transparent 45%),
        radial-gradient(circle at 85% 25%, rgba(236,72,153,0.15), transparent 45%),
        radial-gradient(circle at 50% 95%, rgba(56,189,248,0.12), transparent 55%);
    }

    /* ---------- CARD ANIMATION ---------- */
    @keyframes cardIn {
      from { opacity: 0; transform: translateY(20px) scale(0.98); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }
    .card-in { animation: cardIn 0.5s ease forwards; }

    /* ---------- SHAKE ANIMATION (wrong password) ---------- */
    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      20% { transform: translateX(-8px); }
      40% { transform: translateX(8px); }
      60% { transform: translateX(-6px); }
      80% { transform: translateX(6px); }
    }
    .shake { animation: shake 0.4s ease; }

    /* ---------- INPUT STYLING ---------- */
    .input-field {
      transition: all 0.15s ease;
    }
    .input-field:focus {
      outline: none;
      border-color: #6366f1;
      box-shadow: 0 0 0 3px rgba(99,102,241,0.15);
    }

    /* ---------- GRADIENT LOGO ---------- */
    .logo-gradient {
      background: linear-gradient(135deg, #6366f1 0%, #8b5cf6 50%, #ec4899 100%);
    }
  </style>
</head>
<body class="login-bg bg-slate-50 text-slate-800 min-h-screen flex items-center justify-center p-4 antialiased transition-colors duration-200">

  <!-- Theme Toggle (top-right) -->
  <button id="themeToggle" title="Toggle dark mode"
    class="fixed top-4 right-4 w-10 h-10 flex items-center justify-center rounded-xl bg-white border border-slate-200 hover:bg-slate-100 text-slate-600 transition shadow-sm z-50">
    <i id="themeIcon" class="fa-solid fa-moon"></i>
  </button>

  <!-- Login Card -->
  <div class="w-full max-w-md">

    <!-- Logo & Title -->
    <div class="text-center mb-6">
      <div class="inline-flex items-center justify-center w-16 h-16 rounded-2xl logo-gradient shadow-lg shadow-indigo-500/30 mb-3">
        <i class="fa-solid fa-soap text-white text-2xl"></i>
      </div>
      <h1 class="text-2xl font-extrabold tracking-tight">Prachi Laundry</h1>
      <p class="text-xs text-slate-500 mt-1">Professional Dry Cleaning & Laundry Services</p>
    </div>

    <!-- Login Box -->
    <div class="card-in bg-white rounded-3xl shadow-xl border border-slate-200 p-6 sm:p-8">

      <div class="flex items-center gap-2 mb-5">
        <div class="w-9 h-9 rounded-xl bg-indigo-50 flex items-center justify-center">
          <i class="fa-solid fa-lock text-indigo-600 text-sm"></i>
        </div>
        <div>
          <h2 class="font-bold text-slate-800 leading-tight">Admin Login</h2>
          <p class="text-[11px] text-slate-500">Sign in to access the POS system</p>
        </div>
      </div>

      <!-- Error Message -->
      <div id="errorBox" class="hidden bg-rose-50 border border-rose-200 text-rose-700 text-sm p-3 rounded-xl mb-4 flex items-start gap-2">
        <i class="fa-solid fa-circle-exclamation text-rose-500 mt-0.5"></i>
        <span id="errorText">Invalid username or password.</span>
      </div>

      <form id="loginForm" class="space-y-4">

        <!-- Username -->
        <div>
          <label class="block text-xs font-semibold text-slate-600 uppercase tracking-wider mb-1.5">Username</label>
          <div class="relative">
            <i class="fa-regular fa-user absolute left-4 top-3.5 text-slate-400 text-sm"></i>
            <input type="text" id="username" autocomplete="username" required
              placeholder="Enter your username"
              class="input-field w-full bg-slate-50 border border-slate-200 rounded-xl py-3 pl-11 pr-4 text-sm">
          </div>
        </div>

        <!-- Password -->
        <div>
          <label class="block text-xs font-semibold text-slate-600 uppercase tracking-wider mb-1.5">Password</label>
          <div class="relative">
            <i class="fa-solid fa-key absolute left-4 top-3.5 text-slate-400 text-sm"></i>
            <input type="password" id="password" autocomplete="current-password" required
              placeholder="Enter your password"
              class="input-field w-full bg-slate-50 border border-slate-200 rounded-xl py-3 pl-11 pr-11 text-sm">
            <button type="button" id="togglePassword"
              class="absolute right-3 top-3 w-8 h-8 flex items-center justify-center rounded-lg text-slate-400 hover:text-slate-600 hover:bg-slate-100 transition">
              <i id="eyeIcon" class="fa-regular fa-eye text-sm"></i>
            </button>
          </div>
        </div>

        <!-- Remember me -->
        <div class="flex items-center justify-between">
          <label class="flex items-center gap-2 cursor-pointer select-none">
            <input type="checkbox" id="rememberMe" checked
              class="w-4 h-4 rounded border-slate-300 text-indigo-600 focus:ring-indigo-500 cursor-pointer">
            <span class="text-xs text-slate-600">Keep me signed in</span>
          </label>
        </div>

        <!-- Submit -->
        <button type="submit" id="loginBtn"
          class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-semibold text-sm py-3.5 rounded-xl transition shadow-md shadow-indigo-500/20 flex items-center justify-center gap-2">
          <span id="btnText">Sign In</span>
          <i class="fa-solid fa-arrow-right text-xs" id="btnIcon"></i>
        </button>
      </form>

      <!-- Back to home -->
      <div class="mt-6 pt-5 border-t border-slate-200 text-center">
        <a href="index.html" class="text-xs text-slate-500 hover:text-indigo-600 transition inline-flex items-center gap-1">
          <i class="fa-solid fa-arrow-left text-[10px]"></i> Back to Homepage
        </a>
      </div>
    </div>

    <!-- Hint (Only visible on first load, remove later) -->
    <div class="mt-4 bg-amber-50 border border-amber-200 text-amber-800 text-xs p-3 rounded-xl flex items-start gap-2">
      <i class="fa-solid fa-circle-info mt-0.5"></i>
      <div>
        <p class="font-semibold">Default credentials</p>
        <p class="mt-0.5">Username: <code class="bg-amber-100 px-1 rounded font-mono">admin</code> · Password: <code class="bg-amber-100 px-1 rounded font-mono">prachi2026</code></p>
        <p class="mt-1 text-[10px] opacity-70">You can change these by editing <code>login.html</code> and <code>pos.html</code>.</p>
      </div>
    </div>
  </div>

  <script>
    // ============================================================
    // ⚠️ CHANGE THESE CREDENTIALS FOR PRODUCTION
    // ============================================================
    const VALID_USERNAME = 'admin';
    const VALID_PASSWORD = 'prachi2026';
    // ============================================================

    // ---------- THEME ----------
    const themeToggle = document.getElementById('themeToggle');
    const themeIcon = document.getElementById('themeIcon');

    function applyTheme(theme) {
      if (theme === 'dark') {
        document.documentElement.classList.add('dark');
        themeIcon.className = 'fa-solid fa-sun';
      } else {
        document.documentElement.classList.remove('dark');
        themeIcon.className = 'fa-solid fa-moon';
      }
    }

    let currentTheme = localStorage.getItem('prachi_laundry_theme') || 'light';
    applyTheme(currentTheme);

    themeToggle.addEventListener('click', () => {
      currentTheme = currentTheme === 'dark' ? 'light' : 'dark';
      localStorage.setItem('prachi_laundry_theme', currentTheme);
      applyTheme(currentTheme);
    });

    // ---------- PASSWORD VISIBILITY ----------
    const passwordInput = document.getElementById('password');
    const togglePassword = document.getElementById('togglePassword');
    const eyeIcon = document.getElementById('eyeIcon');

    togglePassword.addEventListener('click', () => {
      const isPassword = passwordInput.type === 'password';
      passwordInput.type = isPassword ? 'text' : 'password';
      eyeIcon.className = isPassword ? 'fa-regular fa-eye-slash text-sm' : 'fa-regular fa-eye text-sm';
    });

    // ---------- LOGIN ----------
    const loginForm = document.getElementById('loginForm');
    const usernameInput = document.getElementById('username');
    const rememberMe = document.getElementById('rememberMe');
    const errorBox = document.getElementById('errorBox');
    const errorText = document.getElementById('errorText');
    const loginBtn = document.getElementById('loginBtn');
    const btnText = document.getElementById('btnText');
    const btnIcon = document.getElementById('btnIcon');

    // If already logged in, redirect to POS
    if (localStorage.getItem('prachi_admin_logged_in') === 'true') {
      window.location.href = 'pos.html';
    }

    loginForm.addEventListener('submit', (e) => {
      e.preventDefault();

      // Clear error
      errorBox.classList.add('hidden');

      const username = usernameInput.value.trim();
      const password = passwordInput.value;

      // Show loading
      loginBtn.disabled = true;
      btnText.textContent = 'Signing in...';
      btnIcon.className = 'fa-solid fa-spinner animate-spin text-xs';

      // Simulate brief delay for realistic feel
      setTimeout(() => {
        if (username === VALID_USERNAME && password === VALID_PASSWORD) {
          // Success
          localStorage.setItem('prachi_admin_logged_in', 'true');
          if (rememberMe.checked) {
            localStorage.setItem('prachi_admin_username', username);
          } else {
            sessionStorage.setItem('prachi_admin_logged_in', 'true');
          }

          // Small success indication
          loginBtn.classList.remove('bg-indigo-600', 'hover:bg-indigo-700');
          loginBtn.classList.add('bg-emerald-600', 'hover:bg-emerald-700');
          btnText.textContent = 'Success!';
          btnIcon.className = 'fa-solid fa-circle-check text-xs';

          setTimeout(() => {
            window.location.href = 'pos.html';
          }, 500);
        } else {
          // Failure
          errorText.textContent = 'Invalid username or password. Please try again.';
          errorBox.classList.remove('hidden');

          // Shake the box
          const card = document.querySelector('.card-in');
          card.classList.add('shake');
          setTimeout(() => card.classList.remove('shake'), 500);

          // Clear password
          passwordInput.value = '';
          passwordInput.focus();

          // Reset button
          loginBtn.disabled = false;
          btnText.textContent = 'Sign In';
          btnIcon.className = 'fa-solid fa-arrow-right text-xs';
        }
      }, 400);
    });

    // Prefill remembered username
    const savedUser = localStorage.getItem('prachi_admin_username');
    if (savedUser) {
      usernameInput.value = savedUser;
      passwordInput.focus();
    } else {
      usernameInput.focus();
    }
  </script>
</body>
</html>
